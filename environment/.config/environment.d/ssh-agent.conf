# Bitwarden's SSH agent, for everything the systemd user manager starts —
# which is every app launched from a Hyprland binding, since those go through
# uwsm-app. Without this, only shells that source ~/.config/bash/envs get an
# agent, so an SSH client opened straight into a terminal (SUPER+SHIFT+S)
# falls back to password auth.
SSH_AUTH_SOCK=${HOME}/.bitwarden-ssh-agent.sock
